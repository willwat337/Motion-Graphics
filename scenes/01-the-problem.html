<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 1 – The Problem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #161616; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }
  .ui {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 10px; align-items: center;
  }
  .ui button {
    font: 600 14px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.04em;
    padding: 12px 18px; border-radius: 999px; border: 0;
    background: rgba(20, 20, 20, 0.85); color: #fff; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }
  .ui button:disabled { opacity: 0.6; cursor: default; }
  .ui button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e04848; margin-right: 8px; vertical-align: 1px; }
  .ui .status { color: #ddd; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div class="ui">
  <span class="status" id="status"></span>
  <button id="record"><span class="dot"></span>Record</button>
</div>

<script>
/* =====================================================================
   CONFIG — edit these to reuse the template for other scenes
   ===================================================================== */

const STAGE = {
  width: 1920,
  height: 1080,
  duration: 8,          // seconds per loop
  fps: 60,              // capture frame rate for recording
  videoBitrate: 12_000_000,
};

const COLORS = {
  bgCenter: '#f4f4f4',
  bgEdge:   '#dcdcdc',
  chartLine: 'rgba(255, 255, 255, 0.25)',
  shadow:     'rgba(0, 0, 0, 0.22)',
  textShadow: 'rgba(0, 0, 0, 0.10)',
  charcoal:  '#2b2b2b',
  lightGray: '#8a8a8a',
  midGray:   '#555555',
  cardInk:   '#ffffff',
  chipLight: '#f3e3a6',
  chipMid:   '#c9a65a',
  chipDark:  '#9c7a35',
  chipLines: 'rgba(95, 70, 25, 0.55)',
};

const FONT_FAMILY = '"Playfair Display", Georgia, "Times New Roman", serif';

const TIMING = {
  cameraStart: 1.00, cameraEnd: 1.06,   // push-in scale over the full loop

  cardsInStart: 0.10,   // first card begins fading in
  cardsInStagger: 0.12, // delay between cards
  cardsInDur: 1.10,     // each card's fade/scale-in duration

  cardsMoveStart: 1.5,  // drift / turn / bob begins
  cardsMoveRamp: 2.0,   // how long bob + turn take to reach full strength

  sheenStart: 2.0,      // first card's sheen sweep
  sheenStagger: 0.55,
  sheenDur: 1.3,

  textStart: 1.0,
  textStagger: 0.3,
  textDur: 0.9,
  textRise: 26,         // px of upward slide

  loopFadeOut: 0.4,     // fade cards + text out at end of loop (set 0 to disable)
};

const LAYOUT = {
  hero: { x: 1210, y: 545 },  // hero object: slightly right of center
  textX: 150,                 // text sits in the left third
};

const SHADOW = {
  cardBlur: 46, cardOffsetX: 0, cardOffsetY: 26,
  textBlur: 18, textOffsetY: 8,
};

const CARD = {
  width: 470,
  height: 470 * 54 / 85.6,    // real card ratio
  radius: 22,
  bobAmp: 12,                  // px
  bobPeriod: 3.6,              // s
  turnAmp: 0.42,               // radians of fake Y-axis turn
  turnPeriod: 5.2,             // s
  fanScaleFrom: 0.86,
};

// Drawn back-to-front (last item is on top).
// fan/spread are offsets from LAYOUT.hero; rot in degrees.
const CARDS = [
  { rate: '7%',  color: '#3fa66b', fan: { x:  40, y:  14, rot:  14 }, spread: { x:  230, y:  160, rot: -8 }, phase: 2.4 },
  { rate: '12%', color: '#3f7fd6', fan: { x:  14, y:   5, rot:   5 }, spread: { x: -200, y:  150, rot:  6 }, phase: 1.1 },
  { rate: '19%', color: '#e8873a', fan: { x: -12, y:  -4, rot:  -5 }, spread: { x:  225, y: -120, rot:  7 }, phase: 3.7 },
  { rate: '24%', color: '#d64545', fan: { x: -40, y: -12, rot: -14 }, spread: { x: -215, y: -140, rot: -10 }, phase: 0.2 },
];

const TEXT_LINES = [
  { text: 'Stuck paying',            weight: 400, size: 46,  color: COLORS.charcoal,  x: 0,  y: 385 },
  { text: 'Debt',                    weight: 700, size: 232, color: COLORS.charcoal,  x: -6, y: 590 },
  { text: 'forever?',                weight: 400, size: 118, color: COLORS.lightGray, x: 70, y: 664 }, // overlaps "Debt"
  { text: 'there’s a smarter order.', weight: 400, size: 38, color: COLORS.midGray, x: 4, y: 762 },
];

const CHART = {
  // Oversized zigzag, normalized y (0 = top, 1 = bottom), spaced evenly on x
  points: [0.86, 0.52, 0.70, 0.34, 0.58, 0.22, 0.44, 0.08, 0.30],
  xStart: -420, xEnd: 2340,
  lineWidth: 48,
  driftX: 60, driftY: 22,      // px, loops seamlessly with the timeline
};

/* =====================================================================
   EASING + TIMELINE HELPERS
   ===================================================================== */

const Ease = {
  linear: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outQuart: t => 1 - Math.pow(1 - t, 4),
};

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const progress = (t, start, dur) => (dur <= 0 ? (t >= start ? 1 : 0) : clamp((t - start) / dur));
const deg = d => (d * Math.PI) / 180;

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const font = (weight, size) => `italic ${weight} ${size}px ${FONT_FAMILY}`;

/* =====================================================================
   RENDERING
   ===================================================================== */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const { width: W, height: H, duration: D } = STAGE;

const bgGradient = (() => {
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W / 2, H / 2));
  g.addColorStop(0, COLORS.bgCenter);
  g.addColorStop(1, COLORS.bgEdge);
  return g;
})();

function drawBackground() {
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, W, H);
}

function drawChartLine(t) {
  const phase = (t / D) * Math.PI * 2;
  const dx = Math.sin(phase) * CHART.driftX;
  const dy = Math.cos(phase) * CHART.driftY;
  const n = CHART.points.length;
  ctx.save();
  ctx.translate(dx, dy);
  ctx.strokeStyle = COLORS.chartLine;
  ctx.lineWidth = CHART.lineWidth;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  CHART.points.forEach((p, i) => {
    const x = lerp(CHART.xStart, CHART.xEnd, i / (n - 1));
    const y = p * H;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.restore();
}

function cardState(card, i, t) {
  // Intro: fade + scale in as a tight fan
  const inP = Ease.outCubic(progress(t, TIMING.cardsInStart + i * TIMING.cardsInStagger, TIMING.cardsInDur));
  // Drift apart
  const moveP = Ease.inOutCubic(progress(t, TIMING.cardsMoveStart, D - TIMING.cardsMoveStart));
  // Bob + turn strength ramps in smoothly so there is no pop at 1.5s
  const ramp = Ease.inOutSine(progress(t, TIMING.cardsMoveStart, TIMING.cardsMoveRamp));
  const local = Math.max(0, t - TIMING.cardsMoveStart);

  const bob = Math.sin((local / CARD.bobPeriod) * Math.PI * 2 + card.phase) * CARD.bobAmp * ramp;
  const turn = Math.sin((local / CARD.turnPeriod) * Math.PI * 2 + card.phase) * CARD.turnAmp * ramp;

  const fanRot = lerp(card.fan.rot * 0.35, card.fan.rot, inP); // fan opens slightly as it appears

  return {
    x: LAYOUT.hero.x + lerp(card.fan.x, card.spread.x, moveP),
    y: LAYOUT.hero.y + lerp(card.fan.y, card.spread.y, moveP) + bob + (1 - inP) * 30,
    rot: deg(lerp(fanRot, card.spread.rot, moveP)),
    scale: lerp(CARD.fanScaleFrom, 1, inP),
    alpha: inP,
    turn,
    sheen: Ease.inOutSine(progress(t, TIMING.sheenStart + i * TIMING.sheenStagger, TIMING.sheenDur)),
  };
}

function drawChip(x, y, w, h) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, COLORS.chipLight);
  g.addColorStop(0.5, COLORS.chipMid);
  g.addColorStop(0.75, COLORS.chipLight);
  g.addColorStop(1, COLORS.chipDark);
  roundRectPath(ctx, x, y, w, h, 8);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.strokeStyle = COLORS.chipLines;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  // contact pads
  ctx.moveTo(x + w * 0.34, y); ctx.lineTo(x + w * 0.34, y + h);
  ctx.moveTo(x + w * 0.66, y); ctx.lineTo(x + w * 0.66, y + h);
  ctx.moveTo(x, y + h * 0.36); ctx.lineTo(x + w * 0.34, y + h * 0.36);
  ctx.moveTo(x, y + h * 0.64); ctx.lineTo(x + w * 0.34, y + h * 0.64);
  ctx.moveTo(x + w * 0.66, y + h * 0.36); ctx.lineTo(x + w, y + h * 0.36);
  ctx.moveTo(x + w * 0.66, y + h * 0.64); ctx.lineTo(x + w, y + h * 0.64);
  ctx.stroke();
  roundRectPath(ctx, x + w * 0.34, y + h * 0.24, w * 0.32, h * 0.52, 4);
  ctx.stroke();
}

function drawContactless(x, y) {
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let k = 1; k <= 3; k++) {
    ctx.beginPath();
    ctx.arc(x, y, 7 * k, -0.6, 0.6);
    ctx.stroke();
  }
}

function drawCard(card, s) {
  const w = CARD.width, h = CARD.height, r = CARD.radius;
  const x0 = -w / 2, y0 = -h / 2;

  ctx.save();
  ctx.globalAlpha *= s.alpha;
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.scale(s.scale, s.scale);
  // Fake Y-axis turn: squash X, skew Y slightly for perspective
  ctx.transform(Math.cos(s.turn), Math.sin(s.turn) * 0.12, 0, 1, 0, 0);

  // Body + soft studio shadow
  const body = ctx.createLinearGradient(x0, y0, x0 + w, y0 + h);
  body.addColorStop(0, mix(card.color, '#ffffff', 0.22));
  body.addColorStop(0.55, card.color);
  body.addColorStop(1, mix(card.color, '#000000', 0.28));
  ctx.save();
  ctx.shadowColor = COLORS.shadow;
  ctx.shadowBlur = SHADOW.cardBlur;
  ctx.shadowOffsetX = SHADOW.cardOffsetX;
  ctx.shadowOffsetY = SHADOW.cardOffsetY;
  roundRectPath(ctx, x0, y0, w, h, r);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.restore();

  // Surface effects, clipped to the card
  ctx.save();
  roundRectPath(ctx, x0, y0, w, h, r);
  ctx.clip();

  // Top gloss
  const gloss = ctx.createLinearGradient(0, y0, 0, y0 + h * 0.55);
  gloss.addColorStop(0, 'rgba(255,255,255,0.26)');
  gloss.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gloss;
  ctx.fillRect(x0, y0, w, h);

  // Static diagonal highlight
  const diag = ctx.createLinearGradient(x0, y0, x0 + w, y0 + h);
  diag.addColorStop(0.30, 'rgba(255,255,255,0)');
  diag.addColorStop(0.42, 'rgba(255,255,255,0.10)');
  diag.addColorStop(0.50, 'rgba(255,255,255,0)');
  ctx.fillStyle = diag;
  ctx.fillRect(x0, y0, w, h);

  // Turn shading: the side turning away darkens
  const shade = Math.abs(Math.sin(s.turn)) * 0.22;
  if (shade > 0.001) {
    const side = Math.sign(s.turn);
    const sg = ctx.createLinearGradient(-side * w / 2, 0, side * w / 2, 0);
    sg.addColorStop(0, 'rgba(0,0,0,0)');
    sg.addColorStop(1, `rgba(0,0,0,${shade})`);
    ctx.fillStyle = sg;
    ctx.fillRect(x0, y0, w, h);
  }

  // Sweeping sheen (once per card)
  if (s.sheen > 0 && s.sheen < 1) {
    const sx = lerp(-w * 0.95, w * 0.95, s.sheen);
    ctx.save();
    ctx.translate(sx, 0);
    ctx.rotate(deg(24));
    const band = 110;
    const sh = ctx.createLinearGradient(-band, 0, band, 0);
    sh.addColorStop(0, 'rgba(255,255,255,0)');
    sh.addColorStop(0.5, 'rgba(255,255,255,0.42)');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(-band, -h * 1.5, band * 2, h * 3);
    ctx.restore();
  }
  ctx.restore();

  // Hairline edge
  roundRectPath(ctx, x0 + 0.75, y0 + 0.75, w - 1.5, h - 1.5, r);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // EMV chip + contactless mark
  const chipW = w * 0.14, chipH = chipW * 0.78;
  const chipX = x0 + w * 0.09, chipY = y0 + h * 0.30;
  drawChip(chipX, chipY, chipW, chipH);
  drawContactless(chipX + chipW + 26, chipY + chipH / 2);

  // Rate
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = COLORS.cardInk;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.font = font(700, Math.round(h * 0.38));
  ctx.fillText(card.rate, x0 + w - 30, y0 + h - 30);
  ctx.globalAlpha *= 0.8;
  ctx.textAlign = 'left';
  ctx.font = font(400, 24);
  ctx.fillText('annual rate', x0 + 32, y0 + h - 36);
  ctx.restore();

  ctx.restore();
}

function drawText(t) {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.shadowColor = COLORS.textShadow;
  ctx.shadowBlur = SHADOW.textBlur;
  ctx.shadowOffsetY = SHADOW.textOffsetY;
  TEXT_LINES.forEach((line, i) => {
    const p = Ease.outQuart(progress(t, TIMING.textStart + i * TIMING.textStagger, TIMING.textDur));
    if (p <= 0) return;
    ctx.save();
    ctx.globalAlpha *= p;
    ctx.font = font(line.weight, line.size);
    ctx.fillStyle = line.color;
    ctx.fillText(line.text, LAYOUT.textX + line.x, line.y + (1 - p) * TIMING.textRise);
    ctx.restore();
  });
  ctx.restore();
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  drawBackground();

  // Camera push-in, centered on the frame
  const cam = lerp(TIMING.cameraStart, TIMING.cameraEnd, Ease.inOutSine(t / D));
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam, cam);
  ctx.translate(-W / 2, -H / 2);

  drawChartLine(t);

  // Content fades out at loop end so the restart is clean
  ctx.globalAlpha = 1 - Ease.inOutSine(progress(t, D - TIMING.loopFadeOut, TIMING.loopFadeOut));
  CARDS.forEach((card, i) => drawCard(card, cardState(card, i, t)));
  drawText(t);
}

/* =====================================================================
   PLAYBACK + RECORDING
   ===================================================================== */

const params = new URLSearchParams(location.search);
const frozenT = params.has('t') ? clamp(parseFloat(params.get('t')) || 0, 0, D) : null;

const recordBtn = document.getElementById('record');
const statusEl = document.getElementById('status');
let startTime = performance.now();
let recorder = null;

function pickMimeType() {
  const types = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
    'video/mp4', // Safari fallback when WebM recording isn't supported
  ];
  return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

function startRecording() {
  const mimeType = pickMimeType();
  if (!window.MediaRecorder || !canvas.captureStream) {
    statusEl.textContent = 'Recording not supported in this browser.';
    return;
  }
  const stream = canvas.captureStream(STAGE.fps);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: STAGE.videoBitrate });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || mimeType || 'video/webm';
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `scene-01-the-problem.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10_000);
    recorder = null;
    recordBtn.disabled = false;
    statusEl.textContent = `Saved .${ext}`;
  };
  startTime = performance.now(); // restart the timeline at 0
  recorder.start(100);
  recordBtn.disabled = true;
}

recordBtn.addEventListener('click', () => { if (!recorder) startRecording(); });

function frame(now) {
  const elapsed = (now - startTime) / 1000;
  if (recorder && recorder.state === 'recording') {
    if (elapsed >= D) {
      render(D); // final frame
      recorder.stop();
    } else {
      statusEl.textContent = `Recording… ${elapsed.toFixed(1)}s / ${D}s`;
    }
  }
  render(frozenT ?? (elapsed % D));
  requestAnimationFrame(frame);
}

// Canvas only uses webfonts once loaded — wait for them (with a timeout fallback)
Promise.race([
  Promise.all([
    document.fonts.load(font(400, 40)),
    document.fonts.load(font(700, 40)),
  ]),
  new Promise(res => setTimeout(res, 3000)),
]).then(() => {
  startTime = performance.now();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
